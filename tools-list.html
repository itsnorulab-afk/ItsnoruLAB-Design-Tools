<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#142438"><title>도구 목록 | ItsnoruLAB Design Tools</title>
<style>:root{font-family:system-ui,"Malgun Gothic",sans-serif;color-scheme:dark;background:#101927;color:#edf3fb}*{box-sizing:border-box}body{margin:0}header{padding:20px 5%;background:#19283c;border-bottom:1px solid #34445b}header strong{font-size:21px}header p{margin:5px 0;color:#b7c5d8}main{max-width:1150px;margin:auto;padding:25px 16px}nav{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:20px}button,select,input{font:inherit;border-radius:8px;padding:10px;background:#263b56;color:#fff;border:1px solid #526780}button{cursor:pointer}button[aria-pressed=true]{background:#2863a6}.panel{background:#19283c;border:1px solid #34445b;border-radius:14px;padding:20px;margin:15px 0}.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));gap:12px}label{display:grid;gap:7px;color:#c4d3e6}input,select{width:100%}table{width:100%;border-collapse:collapse;margin-top:14px}th,td{text-align:left;border-bottom:1px solid #40516a;padding:11px}th{color:#c6d6e9}.summary{font-size:22px;font-weight:700;color:#8fcbff}.muted{color:#b8c5d6}small{line-height:1.7}footer{padding:22px;text-align:center;color:#acbdd0}@media(max-width:600px){th,td{padding:8px;font-size:13px}}</style><link rel="manifest" href="manifest.json"><meta name="apple-mobile-web-app-capable" content="yes"><script defer src="app-update.js?v=0.2.3"></script></head>
<body><header><strong>⚙ ItsnoruLAB Design Tools</strong><p>설계 계산 · 가공 규격 · 기성품 규격 | 로그인 없는 공개판</p></header><style>.home{max-width:1200px;margin:auto;padding:0 22px 60px}.hero{display:grid;grid-template-columns:1.5fr .8fr;gap:25px;align-items:center;padding:80px 0 60px}.eyebrow{font-size:12px;letter-spacing:2px;font-weight:800;color:#7dc4ff}.hero h1{font-size:clamp(32px,4.7vw,62px);line-height:1.2;letter-spacing:-2px;margin:20px 0}.hero p,.section-top p{color:#b7c5d8;font-size:17px;line-height:1.7}.actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:32px}.actions a{text-decoration:none;padding:15px 22px;border-radius:10px;font-weight:700}.primary{background:#4b99f5;color:#081728}.secondary{border:1px solid #566982;color:#fff}.hero-art{border-radius:25px;min-height:310px;display:flex;align-items:center;justify-content:space-around;flex-wrap:wrap;background:radial-gradient(circle at center,#265888,#142438 65%);border:1px solid #416282}.hero-art span{padding:12px;background:#173c62;border-radius:9px;color:#a6d7ff}.gear-icon{font-size:120px;line-height:1}.statbar{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:75px}.statbar>a{color:inherit;text-decoration:none;border:1px solid #3d536e;background:#19283c;padding:25px;border-radius:14px;display:grid;gap:5px}.statbar>a:hover{border-color:#7dc4ff}.statbar small{color:#86c8ff}.statbar strong{font-size:30px}.statbar span{color:#b7c5d8}.section-top{display:flex;justify-content:space-between;align-items:end;gap:15px}.section-top h2{font-size:32px;margin:12px 0}.section-top input{width:min(330px,100%)}.tabs{display:flex;flex-wrap:wrap;gap:8px;margin:25px 0}.tabs button.selected{background:#4b99f5;color:#081728}.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.tool-card{border:1px solid #405572;background:#19283c;border-radius:15px;padding:23px;display:flex;flex-direction:column;gap:12px;min-height:165px;text-decoration:none;color:#fff;transition:transform .15s,border-color .15s}.tool-card:hover{transform:translateY(-3px);border-color:#7dc4ff}.tool-card strong{font-size:18px}.tool-card p{color:#b7c5d8;margin:0;line-height:1.5}.tool-card small{color:#86c8ff}.notice{margin-top:60px;padding:24px;border:1px solid #4b647d;border-radius:14px;background:#182b40}.notice p{color:#c0ccdc;line-height:1.7}.soon{opacity:.72}.soon small{color:#e3c792}@media(max-width:800px){.hero{grid-template-columns:1fr;padding:40px 0}.hero-art{min-height:170px}.gear-icon{font-size:70px}.cards{grid-template-columns:repeat(2,minmax(0,1fr))}.statbar{margin-bottom:40px}}@media(max-width:520px){.home{padding:0 16px 35px}.hero h1{letter-spacing:-1px}.hero-art{display:none}.statbar{grid-template-columns:repeat(2,1fr)}.section-top{display:block}.cards{grid-template-columns:1fr}.section-top input{width:100%}}</style><main class="home"><p style="margin:24px 0"><a class="secondary" href="./" style="padding:10px 14px;border-radius:8px;text-decoration:none">← 홈으로</a></p><section id="catalog"><div class="section-top"><div><span class="eyebrow">TOOLS & REFERENCES</span><h2>설계 도구 모음</h2><p>도구를 검색하거나 분야별로 찾아보세요.</p></div><input id="search" type="search" placeholder="예: 볼스크류, 탭, 모터…" aria-label="도구 검색"></div><div class="tabs"><button class="filter selected" data-category="all">전체</button><button class="filter" data-category="mech">기계·구동</button><button class="filter" data-category="electric">전기</button><button class="filter" data-category="standard">규격</button><button class="filter" data-category="catalog">기성품</button></div><div id="cards" class="cards"></div></section><section class="notice"><strong>설계 검토 시 주의</strong><p>계산 결과와 규격표는 1차 선정용이야. 실제 설비 제작 전에는 안전율, 하중 조건, 제조사 최신 카탈로그 및 적용 규격을 반드시 재확인해야 해.</p></section></main><script>(function(){const data=[["볼스크류 계산","축하중 · 토크 · 회전수 · 좌굴","mech"],["서보모터 선정","토크 · 관성비 · 브레이크","mech"],["LM가이드 선정","하중 · 모멘트 · 수명","mech"],["공압 실린더","추력 · 속도 · 안전율","mech"],["에어소모량","실린더 및 공급량 계산","mech"],["케이블체인","곡률 · 길이 · 제조사 선정","mech"],["스퍼기어 계산","피치원 · 중심거리 · 기어비","mech","gear"],["헬리컬기어 계산","모듈 · 비틀림각 · 기어비","mech","gear"],["타이밍풀리","벨트 · 풀리 치수 계산","mech"],["모터 전류","3상/단상 모터 전류","electric"],["전압강하","배선 길이와 전선 규격","electric"],["DC 전원 용량","DC24V 공급전원 선정","electric"],["PLC I/O","입출력 점수 계산","electric"],["핀박스","핀 구성 확인","electric"],["O링 규격","홈 · 씰 치수","standard"],["멈춤링 규격","축용 · 구멍용 링","standard"],["표면거칠기","가공기호 및 Ra","standard"],["끼워맞춤 공차","축 · 구멍 공차","standard"],["홀·탭 규격","M3~M20 · PT","standard","thread"],["사각파이프","단면 · 중량 규격","standard"],["정밀 링너트","MISUMI PLNY 규격","catalog","plny"],["호닝파이프","내경 · 외경","catalog"],["부시","기성 부시 규격","catalog"]];const paths={"볼스크류 계산":"calculators/ballscrew/","서보모터 선정":"calculators/servo/","LM가이드 선정":"calculators/lm/","공압 실린더":"calculators/cylinder/","에어소모량":"calculators/air-consumption/","케이블체인":"calculators/cable-chain/","스퍼기어 계산":"calculators/gears/spur/","헬리컬기어 계산":"calculators/gears/helical/","타이밍풀리":"calculators/gears/timing-pulley/","모터 전류":"electrical/motor-current/","전압강하":"electrical/voltage-drop/","DC 전원 용량":"electrical/dc-power/","PLC I/O":"electrical/plc-io/","핀박스":"electrical/pin-box/","O링 규격":"standards/o-rings/","멈춤링 규격":"standards/retaining-rings/","표면거칠기":"standards/surface-roughness/","끼워맞춤 공차":"standards/fits/","홀·탭 규격":"standards/holes-taps/","사각파이프":"standards/square-tubes/","정밀 링너트":"catalog/precision-locknuts/","호닝파이프":"catalog/honed-tubes/","부시":"catalog/bushings/"};const cards=document.getElementById("cards"),search=document.getElementById("search");const categories={mech:"기계·구동",electric:"전기 설계",standard:"규격표",catalog:"기성품"};let category=new URLSearchParams(location.search).get("category")||"all";if(!categories[category])category="all";document.querySelector(".section-top h2").textContent=categories[category]||"전체 설계 도구";document.querySelectorAll(".filter").forEach(x=>x.classList.toggle("selected",x.dataset.category===category));function render(){let q=search.value.trim().toLowerCase();cards.innerHTML="";data.forEach(([name,desc,cat,tool])=>{if(category!=="all"&&cat!==category)return;if(!(name+" "+desc).toLowerCase().includes(q))return;const a=document.createElement("a");a.className="tool-card";a.href=paths[name];const k=document.createElement("small");k.textContent="사용 가능 · 열기 →";const h=document.createElement("strong");h.textContent=name;const p=document.createElement("p");p.textContent=desc;a.append(k,h,p);cards.append(a);});}document.querySelectorAll(".filter").forEach(b=>b.addEventListener("click",()=>{category=b.dataset.category;const url=new URL(location.href);url.searchParams.set("category",category);history.replaceState(null,"",url);document.querySelector(".section-top h2").textContent=categories[category]||"전체 설계 도구";document.querySelectorAll(".filter").forEach(x=>x.classList.toggle("selected",x===b));render();}));search.addEventListener("input",render);render();})();</script><footer>ItsnoruLAB Design Tools · Public edition v0.2.3</footer>
</body></html>
